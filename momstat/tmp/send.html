<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>몸스탯 스크린샷 전달(임시)</title></head>
<body>보내는 중…
<script>
(async () => {
  try {
    const r = await fetch('s03-20261025.png', { cache: 'no-store' });
    const buf = await r.arrayBuffer();
    const target = window.opener || (window.parent !== window ? window.parent : null);
    if (target) target.postMessage({ type: 'momstat-s03', buf }, 'https://appstoreconnect.apple.com', [buf]);
    document.body.textContent = '보냈어요 (' + buf.byteLength + ' bytes)';
  } catch (e) { document.body.textContent = '실패: ' + e; }
  setTimeout(() => window.close(), 1500);
})();
</script>
</body></html>
