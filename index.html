<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>박스로고 입은 개발자</title>
<meta name="description" content="SAP 운영 자동화와 AI 워크플로우를 만드는 개발자. 블로그와 프로젝트로 이어지는 링크 허브예요.">
<link rel="canonical" href="https://boxlogodev.github.io/">
<meta property="og:type" content="website">
<meta property="og:title" content="박스로고 입은 개발자">
<meta property="og:description" content="SAP 운영 자동화와 AI 워크플로우를 만드는 개발자">
<meta property="og:url" content="https://boxlogodev.github.io/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --background: #FAFAF8;
    --background-warm: #F5F3EF;
    --foreground: #1A1A1A;
    --foreground-secondary: #6B6B6B;
    --foreground-muted: #A3A3A3;
    --accent-hover: #444444;
    --border: #E8E6E1;
    --border-hover: #D4D0C8;
    --card-bg: #FFFFFF;
    --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #141414;
      --background-warm: #1A1917;
      --foreground: #EBEBEB;
      --foreground-secondary: #999999;
      --foreground-muted: #666666;
      --accent-hover: #CCCCCC;
      --border: #2A2A28;
      --border-hover: #3A3A38;
      --card-bg: #1C1C1C;
      --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 3rem 1.25rem;
    background: var(--background);
    color: var(--foreground);
    font-family: "Inter", "Noto Sans KR", system-ui, sans-serif;
    font-feature-settings: "kern" 1;
    -webkit-font-smoothing: antialiased;
  }

  main { width: 100%; max-width: 34rem; }

  .mark {
    display: inline-block;
    padding: 0.35rem 0.7rem;
    border: 1.5px solid var(--foreground);
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  h1 {
    margin: 1.75rem 0 0;
    font-size: 1.875rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.3;
  }

  .tagline {
    margin: 0.875rem 0 0;
    color: var(--foreground-secondary);
    font-size: 1rem;
    line-height: 1.7;
  }

  .links {
    margin: 2.5rem 0 0;
    padding: 0;
    list-style: none;
    display: grid;
    gap: 0.625rem;
  }

  .links a {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    padding: 1rem 1.125rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card-bg);
    box-shadow: var(--card-shadow);
    color: inherit;
    text-decoration: none;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .links a:hover,
  .links a:focus-visible {
    border-color: var(--border-hover);
    transform: translateY(-1px);
  }
  .links a:focus-visible { outline: 2px solid var(--foreground); outline-offset: 2px; }

  .links strong { font-size: 0.9375rem; font-weight: 600; }
  .links span { color: var(--foreground-muted); font-size: 0.8125rem; }
  .links .arrow { margin-left: auto; color: var(--foreground-muted); }

  .focus {
    margin: 2.5rem 0 0;
    padding: 1.125rem 1.25rem;
    border-radius: 8px;
    background: var(--background-warm);
    color: var(--foreground-secondary);
    font-size: 0.875rem;
    line-height: 1.8;
  }
  .focus b { color: var(--foreground); font-weight: 600; }

  footer {
    margin: 2.5rem 0 0;
    color: var(--foreground-muted);
    font-size: 0.8125rem;
  }
</style>
</head>
<body>
<main>
  <span class="mark">BoxLogo Dev</span>

  <h1>박스로고 입은 개발자</h1>
  <p class="tagline">
    SAP 운영 자동화와 AI 워크플로우를 만들어요.<br>
    반복되는 운영 업무를 시스템으로 바꾸는 일에 관심이 많아요.
  </p>

  <ul class="links">
    <li>
      <a href="https://www.boxlogodev.com">
        <strong>블로그</strong>
        <span>boxlogodev.com</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
    <li>
      <a href="https://github.com/BoxLogoDev">
        <strong>GitHub</strong>
        <span>프로젝트와 오픈소스</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
    <li>
      <a href="https://www.linkedin.com/in/boxlogodev/">
        <strong>LinkedIn</strong>
        <span>경력과 연락</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
  </ul>

  <p class="focus">
    <b>지금 하는 일</b><br>
    SAP 운영 자동화 · AI 에이전트 시스템 · 개발 워크플로우 도구
  </p>

  <footer>© 2026 BoxLogoDev</footer>
</main>
</body>
</html>
